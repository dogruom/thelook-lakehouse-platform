# =============================================================================
# Spark Default Configuration
# =============================================================================
# These are baked into the Docker image. Can be overridden at runtime via:
#   spark-submit --conf key=value
# or via SparkSession.builder.config(key, value)
# =============================================================================

# --- S3A / SeaweedFS (S3-compatible, replaces deprecated MinIO) ---
# Endpoint override for SeaweedFS S3 gateway (path-style, no SSL)
spark.hadoop.fs.s3a.endpoint                    http://seaweedfs:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin123
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# --- Delta Lake ---
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Performance ---
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# --- Streaming ---
# Checkpoint location default (overridden in code)
spark.sql.streaming.checkpointLocation          s3a://lakehouse/checkpoints/streaming

# --- Logging ---
spark.eventLog.enabled                          false
