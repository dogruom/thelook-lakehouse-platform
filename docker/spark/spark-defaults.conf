# =============================================================================
# Spark defaults (ADR-0007). Mounted read-only at /opt/spark/conf/spark-defaults.conf.
# NO credentials in this file: S3A reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the
# container environment (EnvironmentVariableCredentialsProvider). Anything environment-specific
# (cloud endpoint, catalog) is overridden with --conf / SparkSession config, not edited here.
# =============================================================================

# --- Python parity: driver and executors use the image's Python 3.11
spark.pyspark.python                            /usr/local/bin/python3
spark.pyspark.driver.python                     /usr/local/bin/python3

# --- S3A against SeaweedFS (S3 API, path-style, no TLS inside the compose network)
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                    http://seaweedfs:9000
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.aws.credentials.provider    com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# --- Delta Lake
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Performance
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# --- Streaming
# No default checkpoint location on purpose: every query sets its own
# s3a://<bucket>/checkpoints/<job>/ (a checkpoint is never shared between queries).

# --- Logging
spark.eventLog.enabled                          false
