# Committed on purpose: no credentials. The local Thrift Server has no authentication and listens
# on 127.0.0.1 only. Run from dbt_project/: dbt <cmd> --profiles-dir profiles
crm_lakehouse:
  target: local
  outputs:
    local:
      type: spark
      method: thrift
      host: "{{ env_var('DBT_SPARK_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_SPARK_PORT', '10000') | int }}"
      schema: gold
      threads: 1
      connect_retries: 3
      connect_timeout: 30
    # AWS Athena (engine v3) target for the same Gold marts (D-093, W5.D28.4). No credentials here:
    # boto3's default chain (owner SSO/MFA login locally, GitHub OIDC role in CI). The staging dir is
    # required on purpose (no default) so a run can never write to an unintended bucket; `dbt parse`
    # only needs the variable to render, it never connects. Silver is read from the Athena-native
    # Delta registrations in `athena_silver` (D-104; macro register_athena_silver).
    athena:
      type: athena
      s3_staging_dir: "{{ env_var('DBT_ATHENA_S3_STAGING_DIR') }}"
      # Gold tables live under gold/ (no lifecycle rule); athena-results/ expires after 7 days.
      s3_data_dir: "{{ env_var('DBT_ATHENA_S3_DATA_DIR') }}"
      s3_data_naming: schema_table
      region_name: "{{ env_var('DBT_ATHENA_REGION', 'eu-central-1') }}"
      work_group: "{{ env_var('DBT_ATHENA_WORKGROUP', 'crm-lakehouse-dev') }}"
      database: awsdatacatalog
      schema: gold
      threads: 2
