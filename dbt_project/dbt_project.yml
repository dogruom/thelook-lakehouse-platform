# dbt project for the Gold layer (ADR-0007). dbt owns Gold only; Silver/SCD2 are Spark-owned.
# W2.D11: capability spike (models/spike). W4: staging = views over Silver; Gold marts follow.
name: crm_lakehouse
version: "0.1.0"
config-version: 2
profile: crm_lakehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Spike round: 1 = first (full) build, 2 = incremental re-run. Drives the expected state.
  spike_round: 1
  # Tenant-isolation test fixtures (models/tenant_fixtures); enable with --vars '{tenant_fixtures: true}'.
  tenant_fixtures: false
  # dim_date range (inclusive); the calendar must cover every business date in Silver.
  dim_date_start: "2025-01-01"
  dim_date_end: "2027-12-31"
  # Customer 360 / RFM reference day (inclusive, UTC). Fixed default = last day of the synthetic
  # order history, so a build is reproducible; override with --vars '{as_of_date: YYYY-MM-DD}'.
  as_of_date: "2026-01-02"
  # Tenants that get gold_tenant.<model>__<brand> views (macro tenant_scoped_views, W4.D21.3).
  tenant_brands: [brand_alpha, brand_beta, brand_gamma]

models:
  crm_lakehouse:
    +file_format: delta
    spike:
      +schema: spike
      +persist_docs:
        relation: true
        columns: true
    staging:
      +schema: staging
      +materialized: view
    marts:
      # Contracts (data types only, V-14) are enforced on dim_date and fct_orders as the pilot;
      # the other marts follow once Athena (W5.D28.4) confirms the types.
      +schema: marts
      +materialized: table
      dims:
        +tags: [dims]
      facts:
        +tags: [facts]
      analytics:
        +tags: [analytics]
        +post-hook: ["{{ tenant_scoped_views() }}"]
    tenant_fixtures:
      +materialized: view
      +schema: fixtures
      +enabled: "{{ var('tenant_fixtures', false) }}"
      +tags: [tenant_fixture]
