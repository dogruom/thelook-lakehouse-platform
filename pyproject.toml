[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "thelook-lakehouse-platform"
version = "0.1.0"
description = "Production-grade data lakehouse pipeline using TheLook Ecommerce dataset"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ömer Faruk Doğru" }]
keywords = ["data-engineering", "lakehouse", "spark", "kafka", "airflow", "dbt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "moto[s3]>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
airflow = [
    "apache-airflow>=2.9.3",
    "apache-airflow-providers-amazon>=8.0",
    "apache-airflow-providers-apache-spark>=4.7",
    "apache-airflow-providers-postgres>=5.10",
]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1",
]

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================

# -----------------------------------------------------------------------------
# RUFF — Linter + Formatter (replaces flake8, isort, black)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "dist",
    "build",
    "dbt_project/target",
    "dbt_project/dbt_packages",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # too many arguments (common in Spark/Airflow)
    "PLR2004", # magic value comparison
]
unfixable = ["ERA001"]  # never auto-remove commented code

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["airflow", "pyspark", "great_expectations", "structlog"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101", "PLR2004"]
"dags/**/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# -----------------------------------------------------------------------------
# MYPY — Static Type Checker
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "dbt_project/",
    "tests/",
    ".venv/",
]

# -----------------------------------------------------------------------------
# PYTEST — Test Runner
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--no-header",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires Docker)",
    "slow: Slow tests (skipped by default in CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# -----------------------------------------------------------------------------
# COVERAGE
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "src/**/__init__.py",
    "tests/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
