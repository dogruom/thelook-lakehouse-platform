[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitenant-crm-lakehouse"
version = "0.1.0"
description = "Multi-tenant real-time CRM lakehouse: Kafka, Spark, Delta Lake, dbt, Airflow (local-first, cloud-deployable)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ömer Faruk Doğru" }]
keywords = ["data-engineering", "lakehouse", "spark", "kafka", "airflow", "dbt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "faker>=40.44.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.4",
    "structlog>=24.1",
    "boto3>=1.34",
    "confluent-kafka>=2.4",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pyyaml>=6.0.3",
    "moto[s3]>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "import-linter>=2.0",
]
# Owner learning labs: query generated files, Bronze/Silver Delta tables and SeaweedFS with SQL
# from VS Code notebooks (D-042). Not used by pipeline code or CI.
explore = [
    "duckdb>=1.1,<2",
    "ipykernel>=6.29",
]
airflow = [
    "apache-airflow>=2.9.3",
    "apache-airflow-providers-amazon>=8.0",
    "apache-airflow-providers-apache-spark>=4.7",
    "apache-airflow-providers-postgres>=5.10",
]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lakehouse*"]

[tool.setuptools.package-data]
"lakehouse.contracts" = ["schemas/*.json"]

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================

# -----------------------------------------------------------------------------
# RUFF — Linter + Formatter (replaces flake8, isort, black)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "dist",
    "build",
    "dbt_project/target",
    "dbt_project/dbt_packages",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # too many arguments (common in Spark/Airflow)
    "PLR2004", # magic value comparison
]
unfixable = ["ERA001"]  # never auto-remove commented code

[tool.ruff.lint.isort]
known-first-party = ["lakehouse"]
known-third-party = ["airflow", "pyspark", "great_expectations", "structlog"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so these imports must stay at module level.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101", "PLR2004"]
"dags/**/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# -----------------------------------------------------------------------------
# MYPY — Static Type Checker
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "dbt_project/",
    "tests/",
    ".venv/",
]

# -----------------------------------------------------------------------------
# PYTEST — Test Runner
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage gates are applied by the CI command (see .github/workflows/ci.yml), not here,
# so integration and Spark runs are not failed by a unit-test coverage threshold.
addopts = [
    "--tb=short",
    "--strict-markers",
    "--no-header",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires Docker)",
    "slow: Slow tests (skipped by default in CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# -----------------------------------------------------------------------------
# COVERAGE
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["lakehouse"]
omit = [
    "*/lakehouse/*/__init__.py",
    "tests/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# -----------------------------------------------------------------------------
# IMPORT-LINTER — component boundaries (ADR-0009). Run: lint-imports
# -----------------------------------------------------------------------------
[tool.importlinter]
root_package = "lakehouse"

[[tool.importlinter.contracts]]
name = "Shared layers (contracts, common) do not depend on components"
type = "forbidden"
source_modules = ["lakehouse.contracts", "lakehouse.common"]
forbidden_modules = [
    "lakehouse.generator",
    "lakehouse.ingestion",
    "lakehouse.quality",
    "lakehouse.silver",
    "lakehouse.ops",
]

[[tool.importlinter.contracts]]
name = "Components are independent (silver may use quality rules)"
type = "independence"
modules = [
    "lakehouse.generator",
    "lakehouse.ingestion",
    "lakehouse.quality",
    "lakehouse.silver",
    "lakehouse.ops",
]
ignore_imports = ["lakehouse.silver.** -> lakehouse.quality.**"]
# The allowed silver -> quality import does not exist yet (W3.D17): warn (exit 0) instead of
# failing. When it exists, remove this line and narrow the ignore to lakehouse.quality.rules.
unmatched_ignore_imports_alerting = "warn"
