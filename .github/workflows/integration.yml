name: integration

# CI job 2 (ENGINEERING_STANDARDS, .claude/rules/infra.md): the Docker `core` stack plus the
# integration suites. PRs to main and manual dispatch only - free-minute budget matters.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: core stack, smoke test, integration suites
    runs-on: ubuntu-latest
    # Public repo: runner minutes are free. The full suite took 143 min on the first green run (run 43580122008) (2 cores, D-059).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      # Non-interactive: copies the example env file to a new, git-ignored local env file and
      # replaces every `change-me` with a random value. Never overwrites, never prints values.
      # The runner is ephemeral, so these local-only secrets die with the job.
      - name: Create local env file (random local secrets)
        run: python scripts/bootstrap_env.py

      # No layer cache: the Spark image build is the main cost (see this step's duration); a
      # buildx/gha cache would need a bake file or compose changes, which is not worth it yet.
      - name: Build core images
        run: docker compose --profile core build

      # Not `up --wait`: the one-shot init containers (kafka-init, seaweedfs-init) exit 0 by design;
      # smoke_test.py waits (up to 180 s) for healthy services AND finished init jobs.
      # ./dist is a bind mount: if Docker creates it, it is root-owned and submit_job.py (running as
      # the runner user) cannot write the code zip (PermissionError on the first CI run, #20).
      - name: Start core stack
        run: |
          mkdir -p dist
          docker compose --profile core up -d

      - name: Strict smoke test
        run: python scripts/smoke_test.py

      # Sequential on purpose: the suites share one Spark cluster, one broker and one bucket.
      # test_dbt_tenant_tests skips itself (no Thrift Server / dbt venv here); the opt-in broker
      # chaos test needs RUN_BROKER_CHAOS=1 and stays off.
      - name: Integration suites
        run: pytest tests/integration -q -rs --tb=short --junitxml=integration-junit.xml

      # A reachability skip would be a silent green: fail if any test skipped for "unreachable".
      - name: Fail on skipped-because-stack-down
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("integration-junit.xml")
          if not path.is_file():
              sys.exit("no junit file: the integration step did not run")
          bad = [
              case.get("classname", "") + "::" + case.get("name", "")
              for case in ET.parse(path).iter("testcase")
              for skip in case.findall("skipped")
              if "unreachable" in (skip.get("message") or "")
          ]
          print(f"skipped as unreachable: {len(bad)}")
          sys.exit("\n".join(bad) if bad else 0)
          PY

      - name: Container logs (last 50 lines each, on failure)
        if: failure()
        run: docker compose --profile core logs --tail 50 --no-color

      - name: Stop core stack
        if: always()
        run: docker compose --profile core stop
