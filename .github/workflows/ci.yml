name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a run on main: it is the release evidence (M1 review nit).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: lint, types, boundaries, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Component boundaries (import-linter)
        run: lint-imports

      - name: Unit tests with coverage gate
        run: pytest tests/unit -q --cov=lakehouse --cov-report=term-missing --cov-fail-under=80

      - name: Coverage gate per core package (generator, contracts)
        run: |
          coverage report --include="*/lakehouse/generator/*" --fail-under=80
          coverage report --include="*/lakehouse/contracts/*" --fail-under=80

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dbt.txt

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dbt.txt

      - name: dbt parse (no database needed)
        working-directory: dbt_project
        run: dbt parse --profiles-dir profiles

      - name: dbt parse with tenant fixtures enabled
        working-directory: dbt_project
        run: |
          dbt parse --profiles-dir profiles --vars "{tenant_fixtures: true}"

      - name: Fixtures are gated by the tenant_fixtures var
        working-directory: dbt_project
        run: |
          off=$(dbt ls --select tag:tenant_fixture --profiles-dir profiles --output name --quiet | grep -c '^fx_' || true)
          on=$(dbt ls --select tag:tenant_fixture --profiles-dir profiles --output name --quiet --vars "{tenant_fixtures: true}" | grep -c '^fx_' || true)
          echo "fx_ nodes without var: ${off}, with var: ${on}"
          test "${off}" -eq 0
          test "${on}" -gt 0

  dbt-athena:
    name: dbt parse (athena target)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholder: `dbt parse` never connects, it only needs the variable to render the profile.
      DBT_ATHENA_S3_STAGING_DIR: "s3://placeholder/athena-results/"
      DBT_ATHENA_S3_DATA_DIR: "s3://placeholder/gold/"
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Every step is guarded: the requirements file arrives with the W5 dbt-athena change, and a
      # job-level `if` cannot use hashFiles(). No pip cache (cache-dependency-path fails on no match).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: hashFiles('requirements/dbt-athena.txt') != ''
        with:
          python-version: "3.11"

      - name: Install dbt-athena
        if: hashFiles('requirements/dbt-athena.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dbt-athena.txt

      - name: dbt parse --target athena (no AWS access needed)
        if: hashFiles('requirements/dbt-athena.txt') != ''
        working-directory: dbt_project
        run: dbt parse --target athena --profiles-dir profiles

  iac:
    name: terraform fmt, validate, tflint, trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TERRAFORM_VERSION: "1.13.5"
      # sha256 of terraform_1.13.5_linux_amd64.zip (releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_SHA256SUMS, 2026-11-14)
      TERRAFORM_SHA256: "0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a"
      TFLINT_VERSION: "0.65.0"
      # sha256 of tflint_linux_amd64.zip (release checksums.txt of v0.65.0, 2026-11-14)
      TFLINT_SHA256: "d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61"
      TRIVY_VERSION: "0.76.1"
      # sha256 of trivy_0.76.1_Linux-64bit.tar.gz (release trivy_0.76.1_checksums.txt, 2026-11-14)
      TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install terraform, tflint, trivy (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dl" "${RUNNER_TEMP}/bin"
          cd "${RUNNER_TEMP}/dl"
          curl -sSfL -o terraform.zip             "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
          unzip -q -o terraform.zip terraform -d "${RUNNER_TEMP}/bin"
          curl -sSfL -o tflint.zip             "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          unzip -q -o tflint.zip tflint -d "${RUNNER_TEMP}/bin"
          curl -sSfL -o trivy.tgz             "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C "${RUNNER_TEMP}/bin" trivy
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: terraform init (no backend) and validate, per root
        run: |
          set -euo pipefail
          for root in infra/terraform/bootstrap infra/terraform/envs/dev; do
            echo "== ${root}"
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: tflint (recursive)
        env:
          # Only used by `tflint --init` to download plugins from GitHub releases (rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          for candidate in .tflint.hcl infra/terraform/.tflint.hcl; do
            if test -f "${candidate}"; then
              args=(--config "${PWD}/${candidate}")
              break
            fi
          done
          tflint --init "${args[@]}"
          cd infra/terraform
          tflint --recursive "${args[@]}"

      - name: trivy config (HIGH, CRITICAL; reviewed exceptions in .trivyignore)
        run: trivy config infra/terraform --severity HIGH,CRITICAL --exit-code 1 --no-progress

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release checksums file, 2026-11-06)
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan (reviewed exceptions in .gitleaksignore)
        run: ./gitleaks git --redact --no-banner --verbose .
