# =============================================================================
# Multi-Tenant CRM Lakehouse — local stack (Docker Compose)
# =============================================================================
# Profiles (start only what the task needs):
#   core           postgres, seaweedfs (+init), kafka (+init), spark-master, spark-worker
#   sql            spark-thrift  (Spark Thrift Server for dbt-spark; ADR-0007, ADR-0004 spike W2.D11)
#   orchestration  airflow-*     (Airflow 3: init, api-server, dag-processor, scheduler; W4.D22, verified 2026-11-14)
#   tools          spark-test    (pytest inside the Spark image; tests/spark from W2.D7)
#
# Rules (.claude/rules/infra.md):
#   - every image is pinned; no :latest
#   - every host port is bound to 127.0.0.1
#   - every secret is "${VAR:?message}" with no fallback; values live in the gitignored .env
#   - config files are mounted, not baked into images
#
# Usage (PowerShell, repo root):
#   python scripts/bootstrap_env.py                # creates .env with random local secrets if absent
#   python scripts/check_env.py                    # lists missing keys (names only)
#   docker compose --profile core up -d            # first run builds the Spark image (~2-3 GB)
#   python scripts/smoke_test.py
#   docker compose --profile core stop             # never `down -v`
#
# Local UIs (127.0.0.1 only): SeaweedFS filer :9001, Spark master :8181, worker :8182.
# SeaweedFS is S3-compatible, not AWS S3; differences go to docs/LOCAL_VS_CLOUD.md.
# =============================================================================

name: crm_lakehouse

# --- Shared fragments --------------------------------------------------------
x-s3-credentials: &s3-credentials
  # Read by the S3A EnvironmentVariableCredentialsProvider and by the AWS CLI / SDKs.
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY missing - run scripts/bootstrap_env.py}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY missing - run scripts/bootstrap_env.py}

x-spark-common: &spark-common
  image: crm/spark:3.5.9
  build:
    context: ./docker/spark
    dockerfile: Dockerfile
    args:
      SPARK_VERSION: "3.5.9"
  networks:
    - lakehouse_net
  restart: unless-stopped

# Read-only mount: config is not baked into the image and carries no credentials.
x-spark-conf: &spark-conf ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

# Hive metastore client (W2.D11, D-060): the entrypoint renders hive-site.xml (mode 600) into
# HADOOP_CONF_DIR from these variables at container start; Spark's launcher puts that directory on
# the classpath, also for `docker exec ... spark-submit`. The password never enters a file in the
# repository, the image, spark-defaults.conf or a command line.
x-hive-client-env: &hive-client-env
  HADOOP_CONF_DIR: /tmp/hive-conf
  HIVE_METASTORE_DB_HOST: postgres:5432
  HIVE_METASTORE_DB_NAME: ${HIVE_METASTORE_DB_NAME:-hive_metastore}
  HIVE_METASTORE_DB_USER: ${HIVE_METASTORE_DB_USER:-hive}
  HIVE_METASTORE_DB_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:?HIVE_METASTORE_DB_PASSWORD missing - run scripts/bootstrap_env.py}
x-hive-entrypoint: &hive-entrypoint ["python3", "/opt/lakehouse-docker/render_hive_site.py"]
x-hive-render-mount: &hive-render-mount ./docker/spark/render_hive_site.py:/opt/lakehouse-docker/render_hive_site.py:ro

# Airflow 3 (W4.D22, ADR-0010, D-098). Image built and run 2026-11-14
# (`docker compose --profile orchestration build airflow-init`; needs crm/spark:3.5.9 built first).
# Memory: mem_limit per service is an initial estimate (D-098). Observed: on a 7.6 GB Docker VM
# `core` + `sql` + the scheduler fit only with the api-server and dag-processor stopped, and the
# engine failed repeatedly; with 10 GB (`.wslconfig`) the full DAG ran green (W4.D23.4).
x-airflow-common: &airflow-common
  image: crm/airflow:3.0.6
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
    additional_contexts:
      requirements: ./requirements   # dbt.txt for the dbt virtualenv inside the image
    args:
      AIRFLOW_VERSION: "3.0.6"
      SPARK_IMAGE: crm/spark:3.5.9
      SPARK_VERSION: "3.5.9"
  profiles: ["orchestration"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Task SDK: workers call the api-server's execution API (Airflow 3).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY missing - see .env.example}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:?AIRFLOW__API__SECRET_KEY missing - run scripts/bootstrap_env.py}
    # Shared by the api-server and the scheduler: signs the JWT that authorises task runs.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?AIRFLOW__API_AUTH__JWT_SECRET missing - run scripts/bootstrap_env.py}
    AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_metadata}
    AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD missing - run scripts/bootstrap_env.py}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD missing}@postgres:5432/${AIRFLOW_DB_NAME:-airflow_metadata}
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src:ro
    - ./dbt_project:/opt/airflow/dbt_project
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - lakehouse_net
  restart: unless-stopped


services:

  # ===========================================================================
  # POSTGRESQL — Airflow metadata + Hive metastore (ADR-0007). No other databases.
  # Init script runs on the FIRST start of an empty data volume only.
  # ===========================================================================
  postgres:
    image: postgres:15.7-alpine
    profiles: ["core"]
    container_name: crm_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run scripts/bootstrap_env.py}
      POSTGRES_DB: ${POSTGRES_ROOT_DB:-postgres}
      # Consumed by scripts/init_postgres.sh
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_metadata}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD missing - run scripts/bootstrap_env.py}
      HIVE_METASTORE_DB_NAME: ${HIVE_METASTORE_DB_NAME:-hive_metastore}
      HIVE_METASTORE_DB_USER: ${HIVE_METASTORE_DB_USER:-hive}
      HIVE_METASTORE_DB_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:?HIVE_METASTORE_DB_PASSWORD missing - run scripts/bootstrap_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/init_postgres.sh:ro
    ports:
      # Host port is configurable: a native Windows PostgreSQL service often owns 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ===========================================================================
  # SEAWEEDFS — S3-compatible object storage (single bucket, prefixes per Charter)
  # S3 API :9000, filer UI :9001, master API :9333 (all 127.0.0.1)
  # Identities are rendered from S3_ACCESS_KEY / S3_SECRET_KEY at container start.
  # ===========================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    profiles: ["core"]
    container_name: crm_seaweedfs
    stop_grace_period: 60s
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY missing - run scripts/bootstrap_env.py}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY missing - run scripts/bootstrap_env.py}
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/entrypoint.sh:/config/entrypoint.sh:ro
      - ./docker/seaweedfs/s3.json.template:/config/s3.json.template:ro
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Filer UI
      - "127.0.0.1:9333:9333"   # Master API
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # One-shot: create the bucket and the layer prefixes (idempotent).
  seaweedfs-init:
    image: amazon/aws-cli:2.39.5
    profiles: ["core"]
    container_name: crm_seaweedfs_init
    entrypoint: ["/bin/sh", "/scripts/init_storage.sh"]
    environment:
      <<: *s3-credentials
      S3_HOST: seaweedfs
      S3_PORT: "9000"
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/init_storage.sh:/scripts/init_storage.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - lakehouse_net
    restart: on-failure

  # ===========================================================================
  # KAFKA — KRaft, single node (no ZooKeeper). Topics: customer_cdc, clickstream_events.
  # Clients inside the network use kafka:9092; host clients use 127.0.0.1:9094.
  # ===========================================================================
  kafka:
    image: apache/kafka:3.7.1
    profiles: ["core"]
    container_name: crm_kafka
    stop_grace_period: 60s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID missing - see .env.example}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_MS: ${TOPIC_RETENTION_MS:-604800000}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"   # EXTERNAL listener for host clients
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # One-shot: create the two topics (idempotent). There is no Kafka DLQ topic (Charter v8).
  kafka-init:
    image: apache/kafka:3.7.1
    profiles: ["core"]
    container_name: crm_kafka_init
    entrypoint: ["/bin/sh", "/scripts/init_kafka.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CDC_TOPIC: ${CDC_TOPIC:-customer_cdc}
      CLICKSTREAM_TOPIC: ${CLICKSTREAM_TOPIC:-clickstream_events}
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      TOPIC_RETENTION_MS: ${TOPIC_RETENTION_MS:-604800000}
    volumes:
      - ./scripts/init_kafka.sh:/scripts/init_kafka.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lakehouse_net
    restart: on-failure

  # ===========================================================================
  # SPARK — standalone master + worker (Python 3.11, Java 17, Spark 3.5.9, Delta 3.3.3)
  # ===========================================================================
  spark-master:
    <<: *spark-common
    profiles: ["core"]
    container_name: crm_spark_master
    entrypoint: *hive-entrypoint
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      <<: [*s3-credentials, *hive-client-env]
      # Job drivers run here: tables are registered in and read from the Hive metastore (D-060).
      LAKEHOUSE_CATALOG: hive
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8181"
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      ENVIRONMENT: local   # job drivers run here (client mode): JSON logs, not console colours
      # Driver only (silver_customers): pseudonymisation key; never in Spark conf (workers get a broadcast).
      # Pass-through (null value): no default, and no `${VAR:?}` that would break interpolation of
      # the whole file (even `stop`). load_pii_key() is the loud check, before any read or write.
      PII_HMAC_KEY:
    volumes:
      - *spark-conf
      - ./src:/opt/spark-apps/src:ro
      - ./dist:/opt/spark-apps/dist:ro   # built by scripts/submit_job.py (driver-side files only)
      - *hive-render-mount
      - spark_logs:/opt/spark/logs
    ports:
      - "127.0.0.1:8181:8181"   # Master UI (7077 stays inside the compose network)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  spark-worker:
    <<: *spark-common
    profiles: ["core"]
    container_name: crm_spark_worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *s3-credentials
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_WEBUI_PORT: "8182"
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    volumes:
      - *spark-conf
      - ./src:/opt/spark-apps/src:ro
    ports:
      - "127.0.0.1:8182:8182"   # Worker UI
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8182"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Spark Thrift Server for dbt-spark (thrift method), sharing the Postgres-backed Hive metastore
  # with the job drivers (W2.D11, ADR-0004 spike). Start: --profile core --profile sql.
  spark-thrift:
    <<: *spark-common
    profiles: ["sql"]
    container_name: crm_spark_thrift
    entrypoint: *hive-entrypoint
    command:
      - /opt/spark/bin/spark-submit
      - --class
      - org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      - --name
      - thrift-server
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.sql.warehouse.dir=s3a://lakehouse/warehouse
      # dbt date keys (order_date_key, session_date_key) assume a UTC session, like the jobs (D-095)
      - --conf
      - spark.sql.session.timeZone=UTC
      - spark-internal
      - --hiveconf
      - hive.server2.thrift.port=10000
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0
    environment:
      <<: [*s3-credentials, *hive-client-env]
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    volumes:
      - *spark-conf
      - *hive-render-mount
      - ./src:/opt/spark-apps/src:ro
    ports:
      - "127.0.0.1:10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 10000), 3)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # pytest inside the Spark image (PySpark tests never run on the Windows host):
  #   docker compose --profile tools run --rm spark-test pytest tests/spark -q
  # Tests use local[2]: no master, worker or object storage has to be running.
  spark-test:
    <<: *spark-common
    profiles: ["tools"]
    container_name: crm_spark_test
    command: ["pytest", "tests/spark", "-q"]
    working_dir: /workspace
    environment:
      <<: *s3-credentials
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    volumes:
      - *spark-conf
      - ./src:/opt/spark-apps/src:ro
      - ./tests:/workspace/tests:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      # POSIX file-mode tests of the entrypoint script (skipped on the Windows host)
      - ./docker/spark/render_hive_site.py:/workspace/docker/spark/render_hive_site.py:ro
    restart: "no"

  # ===========================================================================
  # AIRFLOW 3 — profile `orchestration` (W4.D22, ADR-0010). Not part of `core`.
  # LocalExecutor: tasks run inside the scheduler container, which therefore also hosts the Spark
  # client-mode drivers (spark-submit to spark://spark-master:7077) and the dbt subprocess.
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: crm_airflow_init
    mem_limit: 768m
    environment:
      <<: *airflow-common-env
      # Read by the command below (FAB auth manager: `airflow users create`).
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD missing - run scripts/bootstrap_env.py}
    # `users create` fails when the user already exists: `|| true` keeps the init idempotent.
    # `db migrate` must succeed (&&). Needs the FAB auth manager configured above.
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username "$$_AIRFLOW_WWW_USER_USERNAME" --password "$$_AIRFLOW_WWW_USER_PASSWORD" --firstname Admin --lastname User --role Admin --email admin@crm-lakehouse.local || true)
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: crm_airflow_api_server
    command: ["api-server"]
    mem_limit: 1g
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: crm_airflow_dag_processor
    command: ["dag-processor"]
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: crm_airflow_scheduler
    # The hive-site.xml renderer runs first (as in spark-master), then the Airflow entrypoint.
    entrypoint: *hive-entrypoint
    command: ["/usr/bin/dumb-init", "--", "/entrypoint", "scheduler"]
    # Scheduler + task supervisors + one Spark driver JVM (768m heap) + a dbt subprocess (estimate).
    mem_limit: 3g
    environment:
      # S3 credentials, endpoint and Kafka address only here: tasks (landing check, Spark drivers)
      # are the only code that talks to storage; init, api-server and dag-processor get none.
      <<: [*airflow-common-env, *s3-credentials, *hive-client-env]
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://seaweedfs:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      AIRFLOW__CORE__PARALLELISM: "4"
      LAKEHOUSE_CATALOG: hive
      ENVIRONMENT: local
      # Executors on the worker connect back to the driver in this container by service name.
      SPARK_DRIVER_HOST: airflow-scheduler
      DBT_SPARK_HOST: spark-thrift
      DBT_SPARK_PORT: "10000"
      # Driver only (silver_customers): pseudonymisation key, pass-through like spark-master.
      PII_HMAC_KEY:
      # Optional alert sink; empty = log the payload only. Pass-through, never a default.
      ALERT_WEBHOOK_URL:
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - ./dbt_project:/opt/airflow/dbt_project
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - *spark-conf
      - *hive-render-mount
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy


# =============================================================================
# VOLUMES (never delete: `docker compose stop`, not `down -v`)
# =============================================================================
volumes:
  postgres_data:
    name: crm_postgres_data
  seaweedfs_data:
    name: crm_seaweedfs_data
  kafka_data:
    name: crm_kafka_data
  airflow_logs:
    name: crm_airflow_logs
  airflow_plugins:
    name: crm_airflow_plugins
  spark_logs:
    name: crm_spark_logs


# =============================================================================
# NETWORKS
# =============================================================================
networks:
  lakehouse_net:
    name: crm_lakehouse_net
    driver: bridge
